name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extensión VS Code (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
      - name: Instalar uatu-audit (prueba de interoperabilidad)
        run: uv tool install "git+https://github.com/INGCOM-UNRN-P1/uatu-tools"
      - run: npm ci
      - run: npm test
      - name: Empaquetar VSIX
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: uatu-vsix
          path: extension/*.vsix
