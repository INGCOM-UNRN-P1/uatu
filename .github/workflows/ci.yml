name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extensión VS Code (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Instalar uv (validador para la prueba de interoperabilidad)
        uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm test
      - name: Empaquetar VSIX
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: uatu-vsix
          path: extension/*.vsix

  validator:
    name: Validador forense (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pruebas
        run: uv run --project cli --python ${{ matrix.python }} python -m unittest discover -s cli/tests -v
      - name: Instalación como uv tool
        run: |
          uv tool install --python ${{ matrix.python }} ./cli
          uatu-audit --help
          uatu-admin --help
