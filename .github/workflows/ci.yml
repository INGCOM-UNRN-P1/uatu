name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extensión VS Code (TypeScript)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      # Las pruebas de interoperabilidad auditan la telemetría de la extensión
      # con el validador real; sin uatu-audit en el PATH se omitirían.
      # uatu-tools es privado: el GITHUB_TOKEN de este repositorio no puede
      # leerlo. UATU_READ_TOKEN (PAT fine-grained con Contents: read sobre
      # uatu-tools) lo habilita; si el repositorio fuera público alcanza con
      # github.token.
      - name: Clonar uatu-tools
        uses: actions/checkout@v7
        with:
          repository: INGCOM-UNRN-P1/uatu-tools
          path: .uatu-tools
          token: ${{ secrets.UATU_READ_TOKEN || github.token }}

      - name: Instalar uatu-audit (interoperabilidad)
        run: |
          uv tool install "$GITHUB_WORKSPACE/.uatu-tools"
          uatu-audit --help >/dev/null

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y ejecutar suite de pruebas
        run: npm test

      - name: Empaquetar VSIX
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: uatu-vsix
          path: extension/*.vsix
